<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123f32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <title>আমার আমল</title>
  <style>
    :root{
      --bg:#f6f8f6;--surface:#ffffff;--ink:#15241e;--muted:#68766f;--brand:#123f32;
      --brand2:#1d5a47;--soft:#eaf3ef;--line:#e2e9e5;--warn:#fff7e7;--warnline:#ecd9a8;
      --shadow:0 10px 28px rgba(24,56,44,.07)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;font-size:16px}
    button{font:inherit}
    .app{max-width:680px;margin:auto;padding:12px 14px 112px}
    .hero{background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff;border-radius:26px;padding:22px 20px 20px;box-shadow:0 16px 40px rgba(18,63,50,.16)}
    .eyebrow{font-size:13px;opacity:.8;margin-bottom:4px}.hero h1{font-size:30px;line-height:1.2;margin:0;font-weight:850;letter-spacing:-.4px}
    .hero p{font-size:14px;line-height:1.6;margin:7px 0 0;opacity:.88}
    .progressRow{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:19px}.bigCount{font-size:22px;font-weight:850}.streak{font-size:13px;background:#ffffff1f;border:1px solid #ffffff24;padding:7px 10px;border-radius:999px}
    .progress{height:10px;background:#ffffff24;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#fff;border-radius:999px;transition:width .25s ease}
    .topline{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.topline h2{font-size:20px;margin:0}.date{font-size:13px;color:var(--brand);background:var(--soft);padding:7px 10px;border-radius:999px;font-weight:750}
    .filters{display:flex;gap:8px;overflow:auto;padding:1px 0 8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:750;font-size:13px}.filter.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .section{margin-top:8px}.sectionLabel{display:flex;align-items:center;gap:8px;margin:18px 3px 8px;font-size:14px;font-weight:850;color:#43564d}.sectionLabel span{font-size:17px}.sectionCount{margin-left:auto;font-weight:700;font-size:12px;color:var(--muted)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin:9px 0;overflow:hidden;box-shadow:var(--shadow)}
    .card.done{border-color:#cfe3da;background:#fbfefd}.cardMain{display:flex;align-items:flex-start;gap:12px;padding:16px}
    .check{width:32px;height:32px;flex:0 0 32px;border:2px solid #a7b8b0;border-radius:11px;background:#fff;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;margin-top:1px}.card.done .check{background:var(--brand);border-color:var(--brand)}
    .meta{min-width:0;flex:1}.title{font-size:17px;font-weight:850;line-height:1.4}.when{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}.badge{display:inline-block;margin-top:7px;background:var(--soft);color:var(--brand);font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}
    .more{border:0;background:transparent;color:var(--brand);font-size:22px;line-height:1;padding:6px 2px 8px 8px;transform:rotate(0);transition:.2s}.card.open .more{transform:rotate(180deg)}
    .details{display:none;border-top:1px solid var(--line);padding:2px 16px 18px}.card.open .details{display:block}
    .arabic{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Amiri",serif;font-size:27px;line-height:2.05;margin:16px 0 4px;color:#102a21}
    .block{margin-top:14px}.label{font-size:12px;letter-spacing:.1px;color:var(--brand);font-weight:850;margin-bottom:5px}.txt{font-size:15.5px;line-height:1.78;color:#263a31}.pron{background:#f8faf9;border-radius:14px;padding:11px 12px}.virtue{background:var(--soft);border-radius:14px;padding:11px 12px}.ref{font-size:13.5px;line-height:1.68;color:var(--muted)}.ref a{color:var(--brand);font-weight:800;text-decoration:none}.ref a:active{text-decoration:underline}
    .note{margin:20px 2px 0;background:var(--warn);border:1px solid var(--warnline);border-radius:15px;padding:12px 13px;font-size:12.5px;line-height:1.65;color:#6b5a32}
    .empty{display:none;text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
    .bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}.bottomIn{max-width:680px;margin:auto;display:flex;gap:9px}.btn{min-height:46px;border:0;border-radius:14px;font-weight:850}.btn.secondary{width:42%;background:var(--soft);color:var(--brand)}.btn.primary{flex:1;background:var(--brand);color:#fff}
    .done .title{text-decoration:none;color:#52645b}.done .badge{background:#edf7f2}
    @media (max-width:380px){.hero h1{font-size:27px}.arabic{font-size:25px}.title{font-size:16px}.app{padding-left:11px;padding-right:11px}.cardMain{padding:14px}}
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">দৈনিক সহিহ আমল ট্র্যাকার</div>
    <h1>আমার আমল</h1>
    <p>অল্প কিছু গুরুত্বপূর্ণ আমল—নিয়মিত করার জন্য সহজভাবে সাজানো।</p>
    <div class="progressRow"><div class="bigCount" id="count">০ / ০ সম্পন্ন</div><div class="streak" id="streak">🔥 ০ দিন</div></div>
    <div class="progress" aria-label="আজকের অগ্রগতি"><div class="bar" id="bar"></div></div>
  </header>

  <div class="topline"><h2>আজকের আমল</h2><div class="date" id="dateLabel"></div></div>
  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">সব</button>
    <button class="filter" data-filter="morning">সকাল</button>
    <button class="filter" data-filter="prayer">সালাতের পর</button>
    <button class="filter" data-filter="evening">সন্ধ্যা</button>
    <button class="filter" data-filter="night">রাত</button>
    <button class="filter" data-filter="daily">দিনে</button>
  </div>

  <main id="list"></main>
  <div class="empty" id="empty">এই বিভাগে কোনো আমল নেই।</div>
  <div class="note"><b>নোট:</b> বাংলা উচ্চারণ কেবল সহায়ক। আরবি অক্ষরের সঠিক মাখরাজ বাংলা হরফে পুরোপুরি প্রকাশ করা যায় না। সম্ভব হলে আরবি দেখে শুদ্ধভাবে শিখুন।</div>
</div>

<div class="bottom"><div class="bottomIn">
  <button class="btn secondary" id="resetBtn">আজ Reset</button>
  <button class="btn primary" id="installBtn">Install App</button>
</div></div>

<script>
const A=[
{id:'salah',group:'daily',icon:'🕌',title:'৫ ওয়াক্ত ফরজ সালাত',when:'প্রতিদিন • সময়মতো',tag:'সর্বোচ্চ অগ্রাধিকার',arabic:'',pron:'',meaning:'পাঁচ ওয়াক্ত ফরজ সালাত সময়মতো আদায় করুন।',virtue:'পাঁচ ওয়াক্ত সালাতের মাধ্যমে আল্লাহ গুনাহ মুছে দেন—হাদিসে একে দরজার সামনে প্রবাহিত নদীতে প্রতিদিন পাঁচবার গোসল করার সাথে তুলনা করা হয়েছে।',ref:'সহিহ আল-বুখারি 528.',url:'https://sunnah.com/bukhari:528'},
{id:'kursi_prayer',group:'prayer',icon:'🕋',title:'ফরজ সালাতের পর আয়াতুল কুরসি',when:'প্রতি ফরজ সালাতের পর • ১ বার',tag:'আয়াতুল কুরসি',arabic:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',pron:'আল্লাহু লা ইলাহা ইল্লা হুয়াল হাইয়্যুল কাইয়্যূম। লা তা’খুযুহু সিনাতুঁ ওয়ালা নাউম। লাহু মা ফিস্-সামাওয়াতি ওয়া মা ফিল আরদ। মান যাল্লাযী ইয়াশফাউ ইন্দাহু ইল্লা বি-ইযনিহ। ইয়া’লামু মা বাইনা আইদীহিম ওয়া মা খালফাহুম। ওয়ালা ইউহীতূনা বিশাইইম মিন ইলমিহী ইল্লা বিমা শা-আ। ওয়াসিআ কুরসিয়্যুহুস সামাওয়াতি ওয়াল আরদ। ওয়ালা ইয়াউদুহু হিফযুহুমা। ওয়া হুয়াল আলিয়্যুল আযীম।',meaning:'আল্লাহ—তিনি ছাড়া কোনো সত্য উপাস্য নেই। তিনি চিরঞ্জীব, সবকিছুর ধারক... তাঁর কুরসি আসমান ও জমিনব্যাপী; তিনি সর্বোচ্চ, মহান।',virtue:'প্রতি ফরজ সালাতের পর আয়াতুল কুরসি পাঠের জন্য জান্নাতে প্রবেশের বিশেষ ফজিলত বর্ণিত হয়েছে।',ref:'Bulugh al-Maram 220; বর্ণনাটি আন-নাসাঈতে এসেছে এবং সহিহ হিসেবে উল্লেখ করা হয়েছে.',url:'https://sunnah.com/bulugh/2/220'},
{id:'posttasbih',group:'prayer',icon:'📿',title:'ফরজের পর ৩৩–৩৩–৩৩ + তাহলিল',when:'প্রতি ফরজ সালাতের পর',tag:'তাসবিহ',arabic:'سُبْحَانَ اللَّهِ ×٣٣  •  الْحَمْدُ لِلَّهِ ×٣٣  •  اللَّهُ أَكْبَرُ ×٣٣',pron:'সুবহানাল্লাহ ৩৩ বার, আলহামদুলিল্লাহ ৩৩ বার, আল্লাহু আকবার ৩৩ বার; এরপর “লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারীকা লাহু...” বলে ১০০ পূর্ণ করুন।',meaning:'আল্লাহর পবিত্রতা, প্রশংসা ও মহত্ত্ব ঘোষণা করা।',virtue:'এভাবে ফরজ সালাতের পর যিকর করলে গুনাহ সমুদ্রের ফেনার মতো হলেও ক্ষমার কথা এসেছে।',ref:'সহিহ মুসলিম 597a.',url:'https://sunnah.com/muslim:597a'},
{id:'3qul_am',group:'morning',icon:'🌅',title:'সকাল: ইখলাস, ফালাক, নাস',when:'সকাল • প্রতিটি ৩ বার',tag:'সুরক্ষা',arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ …  •  قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ …  •  قُلْ أَعُوذُ بِرَبِّ النَّاسِ …',pron:'কুল হুয়াল্লাহু আহাদ… / কুল আউযু বিরাব্বিল ফালাক… / কুল আউযু বিরাব্বিন্নাস…',meaning:'সূরা ইখলাস, সূরা ফালাক ও সূরা নাস—প্রতিটি তিনবার পড়ুন।',virtue:'সকাল ও সন্ধ্যায় তিনবার পড়লে “সবকিছুর জন্য যথেষ্ট হবে” বলে হাদিসে এসেছে।',ref:'সুনান আবু দাউদ 5082 — হাসান.',url:'https://sunnah.com/abudawud:5082'},
{id:'sayyid_am',group:'morning',icon:'🤲',title:'সাইয়্যিদুল ইস্তিগফার — সকাল',when:'সকাল • ১ বার',tag:'ইস্তিগফার',arabic:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',pron:'আল্লাহুম্মা আনতা রব্বী, লা ইলাহা ইল্লা আনতা। খালাকতানী ওয়া আনা আবদুকা। ওয়া আনা আলা আহদিকা ওয়া ওয়াদিকা মাসতাতা’তু। আউযু বিকা মিন শাররি মা সানা’তু। আবূউ লাকা বিনি’মাতিকা আলাইয়্যা, ওয়া আবূউ লাকা বিযাম্বী। ফাগফির লী; ফা-ইন্নাহু লা ইয়াগফিরুয যুনূবা ইল্লা আনতা।',meaning:'হে আল্লাহ, আপনি আমার রব; আপনি ছাড়া কোনো সত্য উপাস্য নেই... আমার গুনাহ ক্ষমা করুন; আপনি ছাড়া কেউ গুনাহ ক্ষমা করতে পারে না।',virtue:'দিনে দৃঢ় বিশ্বাসসহ পড়ে সন্ধ্যার আগে মারা গেলে জান্নাতবাসী হওয়ার সুসংবাদ এসেছে।',ref:'সহিহ আল-বুখারি 6306.',url:'https://sunnah.com/bukhari:6306'},
{id:'3qul_pm',group:'evening',icon:'🌇',title:'সন্ধ্যা: ইখলাস, ফালাক, নাস',when:'সন্ধ্যা • প্রতিটি ৩ বার',tag:'সুরক্ষা',arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ …  •  قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ …  •  قُلْ أَعُوذُ بِرَبِّ النَّاسِ …',pron:'কুল হুয়াল্লাহু আহাদ… / কুল আউযু বিরাব্বিল ফালাক… / কুল আউযু বিরাব্বিন্নাস…',meaning:'সূরা ইখলাস, সূরা ফালাক ও সূরা নাস—প্রতিটি তিনবার পড়ুন।',virtue:'সকাল ও সন্ধ্যায় তিনবার পড়লে “সবকিছুর জন্য যথেষ্ট হবে” বলে হাদিসে এসেছে।',ref:'সুনান আবু দাউদ 5082 — হাসান.',url:'https://sunnah.com/abudawud:5082'},
{id:'sayyid_pm',group:'evening',icon:'🤲',title:'সাইয়্যিদুল ইস্তিগফার — সন্ধ্যা',when:'সন্ধ্যা • ১ বার',tag:'ইস্তিগফার',arabic:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',pron:'আল্লাহুম্মা আনতা রব্বী, লা ইলাহা ইল্লা আনতা… ফাগফির লী; ফা-ইন্নাহু লা ইয়াগফিরুয যুনূবা ইল্লা আনতা।',meaning:'হে আল্লাহ, আপনি আমার রব... আমার গুনাহ ক্ষমা করুন; আপনি ছাড়া কেউ গুনাহ ক্ষমা করতে পারে না।',virtue:'রাতে দৃঢ় বিশ্বাসসহ পড়ে সকাল হওয়ার আগে মারা গেলে জান্নাতবাসী হওয়ার সুসংবাদ এসেছে।',ref:'সহিহ আল-বুখারি 6306.',url:'https://sunnah.com/bukhari:6306'},
{id:'sub100',group:'daily',icon:'✨',title:'সুবহানাল্লাহি ওয়া বিহামদিহি',when:'দিনে • ১০০ বার',tag:'সহজ যিকর',arabic:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',pron:'সুবহানাল্লাহি ওয়া বিহামদিহি।',meaning:'আল্লাহ পবিত্র; তাঁরই প্রশংসা।',virtue:'দিনে ১০০ বার বললে গুনাহ সমুদ্রের ফেনার মতো হলেও মুছে দেওয়ার কথা এসেছে।',ref:'সহিহ মুসলিম 2691.',url:'https://sunnah.com/muslim:2691'},
{id:'tahlil100',group:'daily',icon:'☀️',title:'তাহলিল ১০০ বার',when:'দিনে • ১০০ বার',tag:'বড় ফজিলত',arabic:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',pron:'লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারীকা লাহু, লাহুল মুলকু ওয়া লাহুল হামদু, ওয়া হুয়া আলা কুল্লি শাইইন কাদীর।',meaning:'আল্লাহ ছাড়া কোনো সত্য উপাস্য নেই; তিনি এক, তাঁর কোনো শরিক নেই; রাজত্ব ও প্রশংসা তাঁরই; তিনি সবকিছুর উপর ক্ষমতাবান।',virtue:'১০ দাস মুক্তির সমান সওয়াব, ১০০ নেকি, ১০০ গুনাহ মোচন এবং দিনভর শয়তান থেকে সুরক্ষার কথা এসেছে।',ref:'সহিহ মুসলিম 2691; সহিহ আল-বুখারি 3293.',url:'https://sunnah.com/muslim:2691'},
{id:'kursi_sleep',group:'night',icon:'🌙',title:'ঘুমের আগে আয়াতুল কুরসি',when:'ঘুমানোর আগে • ১ বার',tag:'রাতের সুরক্ষা',arabic:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ …',pron:'আয়াতুল কুরসি—সূরা আল-বাকারা ২:২৫৫। পূর্ণ উচ্চারণ উপরের “ফরজ সালাতের পর আয়াতুল কুরসি” কার্ডে আছে।',meaning:'ঘুমানোর আগে সম্পূর্ণ আয়াতুল কুরসি পড়ুন।',virtue:'ঘুমের আগে পড়লে আল্লাহর পক্ষ থেকে একজন রক্ষক থাকে এবং সকাল পর্যন্ত শয়তান কাছে আসে না।',ref:'সহিহ আল-বুখারি 2311.',url:'https://sunnah.com/bukhari:2311'}
];

const GROUPS={morning:['🌅','সকাল'],prayer:['🕌','সালাতের পর'],evening:['🌇','সন্ধ্যা'],daily:['☀️','দিনে'],night:['🌙','রাত']};
const keyDate=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let installPrompt=null,currentFilter='all';
const load=()=>JSON.parse(localStorage.getItem('amal-'+keyDate())||'{}');
function save(s){localStorage.setItem('amal-'+keyDate(),JSON.stringify(s));updateStreak(s)}
function bn(n){return String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d])}
function cardHTML(x,done){return `<article class="card${done?' done':''}" data-group="${x.group}">
  <div class="cardMain">
    <button class="check" aria-label="${x.title} সম্পন্ন হিসেবে চিহ্নিত করুন">${done?'✓':''}</button>
    <div class="meta"><div class="title">${x.icon} ${x.title}</div><div class="when">${x.when}</div><span class="badge">${x.tag}</span></div>
    <button class="more" aria-label="বিস্তারিত দেখুন">⌄</button>
  </div>
  <div class="details">
    ${x.arabic?`<div class="arabic">${x.arabic}</div>`:''}
    ${x.pron?`<div class="block"><div class="label">বাংলা উচ্চারণ</div><div class="txt pron">${x.pron}</div></div>`:''}
    <div class="block"><div class="label">কী করবেন / অর্থ</div><div class="txt">${x.meaning}</div></div>
    <div class="block"><div class="label">ফজিলত</div><div class="txt virtue">${x.virtue}</div></div>
    <div class="block"><div class="label">রেফারেন্স</div><div class="ref">${x.ref} <a target="_blank" rel="noopener" href="${x.url}">হাদিস দেখুন ↗</a></div></div>
  </div>
</article>`}
function render(){
  const s=load(),root=document.getElementById('list');root.innerHTML='';
  const visible=A.filter(x=>currentFilter==='all'||x.group===currentFilter);
  Object.entries(GROUPS).forEach(([g,[icon,label]])=>{
    const items=visible.filter(x=>x.group===g); if(!items.length)return;
    const section=document.createElement('section');section.className='section';
    const completed=items.filter(x=>s[x.id]).length;
    section.innerHTML=`<div class="sectionLabel"><span>${icon}</span>${label}<div class="sectionCount">${bn(completed)}/${bn(items.length)}</div></div>`;
    items.forEach(x=>{
      const wrap=document.createElement('div');wrap.innerHTML=cardHTML(x,!!s[x.id]);const card=wrap.firstElementChild;
      card.querySelector('.check').onclick=()=>{s[x.id]=!s[x.id];save(s);render()};
      card.querySelector('.more').onclick=()=>card.classList.toggle('open');
      card.querySelector('.cardMain').onclick=(e)=>{if(e.target.closest('.check')||e.target.closest('.more'))return;card.classList.toggle('open')};
      section.appendChild(card)
    });root.appendChild(section)
  });
  document.getElementById('empty').style.display=visible.length?'none':'block';updateTop(s)
}
function updateTop(s){
  const n=A.filter(x=>s[x.id]).length, pct=Math.round(n/A.length*100);
  document.getElementById('count').textContent=`${bn(n)} / ${bn(A.length)} সম্পন্ন`;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
  document.getElementById('streak').textContent='🔥 '+bn(Number(localStorage.getItem('streak')||0))+' দিন';
}
function updateStreak(s){
  if(A.filter(x=>s[x.id]).length!==A.length)return;
  const today=keyDate(),last=localStorage.getItem('streak-last');if(last===today)return;
  let st=Number(localStorage.getItem('streak')||0);
  if(last){const prev=new Date(last+'T00:00:00'),cur=new Date(today+'T00:00:00');const d=Math.round((cur-prev)/86400000);st=d===1?st+1:1}else st=1;
  localStorage.setItem('streak',st);localStorage.setItem('streak-last',today)
}
document.getElementById('filters').onclick=e=>{const b=e.target.closest('.filter');if(!b)return;currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};
document.getElementById('resetBtn').onclick=()=>{if(confirm('আজকের সব টিক মুছে ফেলবেন?')){localStorage.removeItem('amal-'+keyDate());render()}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
document.getElementById('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else alert('Chrome menu → Install app / Add to Home screen চাপুন।')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
